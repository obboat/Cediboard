<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CEDIBOARD — Ghana's numbers, clearly told · A Finex Insights publication</title>
<!--
  ==========================================================================
  CEDIBOARD — interactive flip newspaper (Ivory Charcoal design system)
  Pages are a 3:4 design grid (810 × 1080). Desktop shows a two-page
  spread with real 3D sheet flips; narrow screens fall back to a
  single-page fold-turn. All figures marked SAMPLE are illustrative.
  ==========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1814; --muted:#6a6458; --ivory:#f5f3ee; --paper:#fbfaf6;
    --gold:#c8960c; --emerald:#3BA874; --coral:#E05040;
    --track:#e4e1d8; --barsc:#cdc9bf;
    --flag-r:#CE1126; --flag-y:#FCD116; --flag-g:#006B3F;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:"Google Sans Flex","Google Sans","Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% 30%, #46423a 0%, #2e2b25 55%, #201e1a 100%);
    color:var(--ivory);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ============ STAGE / BOOK GEOMETRY ============ */
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #scaler{ position:relative; }
  #book{
    position:relative; transform-style:preserve-3d; perspective:2800px;
    transition:transform 1.7s cubic-bezier(.42,.03,.18,1);
  }
  #book.mode-spread{ width:1620px; height:1080px; }
  #book.mode-single{ width:810px;  height:1080px; }

  /* stacked paper edges */
  .edge{ position:absolute; top:10px; bottom:10px; z-index:1;
         background:repeating-linear-gradient(90deg,#efede6 0 1.5px,#d6d2c6 1.5px 3px);
         border-radius:2px; box-shadow:0 18px 40px rgba(0,0,0,.45); }
  #edgeL{ right:calc(100% - 1px); } #edgeR{ left:calc(100% - 1px); }

  /* sheets (spread mode) */
  .sheet{
    position:absolute; left:50%; top:0; width:810px; height:1080px;
    transform-origin:left center; transform-style:preserve-3d;
    transform:rotateY(0deg);
    /* slow start, long graceful settle — like paper falling into place */
    transition:transform 1.7s cubic-bezier(.42,.03,.18,1);
  }
  .sheet.flipped{ transform:rotateY(-180deg); }
  .sheet.turning{ z-index:600 !important; }
  .sheet.peek{ transform:rotateY(-7deg); transition-duration:.8s; }
  .sheet.flipped.peek{ transform:rotateY(-173deg); }
  .face{
    position:absolute; inset:0; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--ivory);
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .face.back{ transform:rotateY(180deg); }
  /* spine + turn shading */
  .face::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:40; }
  .face.front::before{ background:linear-gradient(90deg, rgba(26,24,20,.16) 0, rgba(26,24,20,0) 7%); }
  .face.back::before{  background:linear-gradient(270deg, rgba(26,24,20,.16) 0, rgba(26,24,20,0) 7%); }
  .face::after{ content:""; position:absolute; inset:0; pointer-events:none; z-index:41;
                background:linear-gradient(90deg, rgba(26,24,20,.28), rgba(26,24,20,0) 55%);
                opacity:0; transition:opacity .85s ease; }
  .sheet.turning .face::after{ opacity:.45; }

  /* single mode pages */
  #book.mode-single .page{
    position:absolute; inset:0; box-shadow:0 24px 60px rgba(0,0,0,.35);
    transform-origin:left center;
  }

  /* ============ PAGE (810 × 1080 grid) ============ */
  .page{
    width:810px; height:1080px; background:var(--ivory); color:var(--ink);
    position:relative; display:flex; flex-direction:column; overflow:hidden;
    user-select:none;
  }
  .page.dark{ background:#1a1814; color:var(--ivory); }

  /* shared chrome */
  .hd{ display:flex; justify-content:space-between; align-items:flex-start;
       padding:40px 48px 0 48px; }
  .eyebrow{ font-size:15px; letter-spacing:4.5px; font-weight:600; color:var(--muted);
            text-transform:uppercase; padding-top:4px; }
  .eyebrow b{ color:var(--gold); font-weight:700; }
  .wordmark{ text-align:right; }
  .wordmark .f1{ font-size:18px; font-weight:700; letter-spacing:3px; }
  .wordmark .f1 span{ color:var(--gold); }
  .wordmark .f2{ font-size:10px; letter-spacing:2.4px; color:var(--muted); margin-top:2px; }
  .page.dark .eyebrow{ color:#a49d8e; }
  .page.dark .wordmark .f2{ color:#a49d8e; }

  .ft{ margin-top:auto; padding:0 48px 32px 48px; }
  .src{ font-size:12.5px; color:var(--muted); padding-bottom:12px; line-height:1.45; }
  .page.dark .src{ color:#a49d8e; }
  .ftrow{ display:flex; justify-content:space-between; align-items:center;
          border-top:3px solid currentColor; padding-top:15px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .flag{ width:40px; height:27px; display:flex; flex-direction:column; position:relative;
         border-radius:2px; overflow:hidden; flex:none; }
  .flag div{ flex:1; } .fr{background:var(--flag-r);} .fy{background:var(--flag-y);} .fg{background:var(--flag-g);}
  .flag .star{ position:absolute; left:50%; top:50%; transform:translate(-50%,-54%);
               font-size:14px; color:var(--ink); }
  .handles{ font-size:13.5px; font-weight:600; }
  .handles span{ color:var(--muted); font-weight:500; }
  .page.dark .handles span{ color:#a49d8e; }
  .folio{ font-size:13.5px; color:var(--muted); font-weight:600; letter-spacing:1px; }
  .page.dark .folio{ color:#a49d8e; }

  .sample{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:2px;
           color:var(--gold); border:1.5px solid var(--gold); border-radius:20px;
           padding:3px 10px; vertical-align:middle; }

  .adslot{ margin:18px 48px 0; border:2px dashed var(--gold); border-radius:14px;
           padding:13px 20px 14px; text-align:center; background:rgba(200,150,12,.06); }
  .adslot .k{ font-size:10px; letter-spacing:3px; color:var(--muted); font-weight:800; }
  .adslot b{ display:block; font-size:17px; font-weight:800; margin-top:3px; }
  .adslot span{ display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px; }
  .adslot span i{ font-style:normal; color:var(--gold); font-weight:800; }
  .adslot a{ color:var(--gold); font-weight:800; text-decoration:none; }
  .adslot a:hover{ text-decoration:underline; }
  .page.dark .adslot .k, .page.dark .adslot span{ color:#a49d8e; }

  .pos{ color:var(--coral); } .neg{ color:var(--emerald); } .flat{ color:var(--gold); }

  /* ---------- COVER ---------- */
  .cv-rules{ margin:22px 48px 0; border-top:3.5px solid var(--ink); border-bottom:1.5px solid var(--ink); height:8px; }
  .cv-mast{ text-align:center; padding:20px 40px 0; }
  .cv-title{ font-size:80px; font-weight:800; letter-spacing:2px; line-height:1; margin-top:6px; }
  .cv-title span{ color:var(--gold); }
  .cv-tag{ font-size:16.5px; color:var(--muted); margin-top:9px; letter-spacing:.3px; }
  .cv-date{ display:flex; justify-content:center; gap:14px; margin:16px 48px 0; padding:10px 0;
            border-top:1.5px solid var(--ink); border-bottom:3.5px solid var(--ink);
            font-size:13.5px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; }
  .cv-date i{ font-style:normal; color:var(--gold); }
  .cv-lead{ display:flex; gap:18px; margin:18px 48px 0; background:var(--paper);
            border:1.5px solid var(--track); border-radius:14px; padding:14px; cursor:pointer;
            align-items:center; }
  .cv-lead img{ width:285px; height:148px; object-fit:contain; background:#fff; border-radius:10px;
                border:1px solid var(--track); flex:none; }
  .cv-lead .k{ font-size:11.5px; letter-spacing:3px; color:var(--gold); font-weight:800; }
  .cv-lead h2{ font-size:26px; font-weight:800; line-height:1.14; margin-top:7px; transition:color .15s; }
  .cv-lead:hover h2{ color:var(--gold); }
  .cv-lead p{ font-size:13.5px; color:var(--muted); line-height:1.45; margin-top:8px; }
  .cv-lead p b{ color:var(--ink); font-weight:800; }
  .cv-glance{ display:flex; margin:14px 48px 0; background:#1a1814; color:var(--ivory);
              border-radius:12px; padding:13px 26px; justify-content:space-between; align-items:center; }
  .cv-glance .g{ display:flex; align-items:baseline; gap:9px; }
  .cv-glance .g span{ font-size:11px; letter-spacing:2px; color:#a49d8e; font-weight:700; }
  .cv-glance .g b{ font-size:21px; font-weight:800; }
  .cv-glance .g i{ font-style:normal; font-size:11.5px; font-weight:700; }
  .cv-toc{ margin:18px 48px 0; }
  .cv-toc h3{ font-size:14px; letter-spacing:4px; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .toc-row{ display:flex; align-items:baseline; gap:12px; padding:6px 4px; cursor:pointer;
            border-bottom:1px solid var(--track); }
  .toc-row:hover .t{ color:var(--gold); }
  .toc-row .n{ font-size:13.5px; font-weight:700; color:var(--gold); width:26px; flex:none; }
  .toc-row .t{ font-size:16.5px; font-weight:700; transition:color .15s; }
  .toc-row .sub{ font-size:14px; color:var(--muted); }
  .toc-row .lead{ flex:1; border-bottom:2px dotted var(--barsc); transform:translateY(-4px); }

  /* ---------- HEADLINES ---------- */
  .hl-title{ text-align:center; padding:18px 48px 0; }
  .hl-title h1{ font-size:34px; font-weight:800; line-height:1.25; }
  .hl-title .sub{ font-size:15px; color:var(--muted); margin-top:6px; }
  .hl-grid{ display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:14px;
            margin:18px 48px 0; flex:1; min-height:0; }
  .story{ background:var(--paper); border:1.5px solid var(--track); border-radius:14px;
          padding:13px 14px 12px; display:flex; flex-direction:column; gap:9px;
          justify-content:flex-start; min-height:0; }
  .story .top{ display:flex; gap:10px; align-items:center; flex:none; }
  .story .chip{ width:40px; height:40px; border-radius:10px; flex:none; display:flex;
                align-items:center; justify-content:center; font-size:20px; }
  .story h2{ font-size:16.5px; font-weight:800; line-height:1.18; }
  .story .pic{ flex:1; min-height:90px; width:100%; object-fit:cover; border-radius:9px;
               border:1px solid var(--track); }
  .story p{ font-size:12.5px; color:var(--muted); line-height:1.42; flex:none;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- FX PAGES ---------- */
  .fx-date{ align-self:center; margin-top:16px; border:2px solid var(--ink); border-radius:26px;
            padding:6px 22px; font-size:13.5px; font-weight:700; letter-spacing:3px; }
  .fx-title{ text-align:center; font-size:62px; font-weight:800; letter-spacing:-1px; margin-top:10px; }
  .fx-title .arr{ color:var(--gold); font-weight:700; }
  .fx-rule{ width:300px; height:5px; background:var(--gold); margin:12px auto 0; border-radius:3px; }
  .fx-sub{ text-align:center; font-size:16px; color:var(--muted); font-weight:600; margin-top:12px; }
  .fx-leg{ display:flex; justify-content:center; gap:26px; margin-top:10px; font-size:14px;
           color:var(--muted); font-weight:600; }
  .fx-leg b{ font-weight:700; }
  .fx-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 48px 0; }
  .fxc{ background:var(--paper); border-radius:13px; box-shadow:0 3px 10px rgba(26,24,20,.07);
        border:1px solid var(--track); overflow:hidden; text-align:center; padding-bottom:15px; }
  .fxc .tab{ height:17px; background:var(--gold); display:flex; justify-content:space-between;
             padding:0 26px; align-items:center; margin-bottom:13px; }
  .fxc .slot{ width:26px; height:6px; background:var(--ivory); border-radius:3px; }
  .fxc h3{ font-size:17px; font-weight:800; min-height:40px; display:flex; align-items:center;
           justify-content:center; padding:0 8px; line-height:1.15; }
  .fxc .rate{ font-size:37px; font-weight:800; letter-spacing:-1px; margin-top:8px; }
  .fxc .rate .tri{ font-size:19px; vertical-align:3px; margin-right:5px; }
  .fxc .rate .cur{ font-size:22px; font-weight:700; color:var(--muted); margin-right:2px; }
  .fxc .lbl{ font-size:13px; color:var(--muted); font-weight:600; margin-top:7px; }
  .fxc .chg{ font-size:13px; font-weight:700; margin-top:3px; }

  /* ---------- FUEL ---------- */
  .fuelc h3{ min-height:28px; }
  .fuelc .fl2{ display:flex; align-items:stretch; margin-top:5px; padding:0 10px; }
  .fuelc .fl2>div{ flex:1; }
  .fuelc .fl2 .sep{ flex:none; width:1.5px; background:var(--track); margin:4px 0; }
  .fuelc .fl2 span{ display:block; font-size:10px; letter-spacing:1.5px; color:var(--muted); font-weight:800; }
  .fuelc .fl2 b{ display:block; font-size:23px; font-weight:800; margin-top:3px; letter-spacing:-.5px; }
  .fuelc .fl2 b .cur{ font-size:13px; color:var(--muted); font-weight:700; }
  .fuelc .fl2 i{ font-style:normal; display:block; font-size:11px; font-weight:800; margin-top:2px; }

  /* ---------- FULL-PAGE SPONSORSHIP ---------- */
  .fp-ad{ flex:1; margin:24px 48px 0; border:3px dashed var(--gold); border-radius:20px;
          background:rgba(200,150,12,.05); display:flex; flex-direction:column; align-items:center;
          justify-content:center; text-align:center; padding:40px; }
  .fp-ad .k{ font-size:13px; letter-spacing:4px; color:var(--muted); font-weight:800; }
  .fp-ad .big{ font-size:62px; font-weight:800; line-height:1.05; margin-top:18px; }
  .fp-ad p{ font-size:16px; color:var(--muted); max-width:440px; line-height:1.55; margin-top:18px; }
  .fp-ad .cta{ display:flex; gap:14px; margin-top:30px; }
  .fp-ad .cta a{ display:inline-block; border-radius:30px; padding:13px 26px; font-size:15px;
                 font-weight:800; text-decoration:none; }
  .fp-ad .cta a.call{ background:var(--ink); color:var(--ivory); }
  .fp-ad .cta a.wa{ border:2.5px solid var(--gold); color:var(--gold); }
  .fp-ad .cta a:hover{ opacity:.85; }

  /* ---------- GSE ---------- */
  .gse-date{ padding:14px 48px 0; font-size:19px; font-weight:800; }
  .gse-date span{ font-size:14px; color:var(--muted); font-weight:600; margin-left:8px; }
  .gse-idx{ display:flex; gap:4px; margin:14px 48px 0; }
  .gse-idx .panel{ flex:1; background:#1a1814; color:var(--ivory); padding:20px 24px 18px; }
  .gse-idx .panel:first-child{ border-radius:14px 0 0 14px; background:#12100d; }
  .gse-idx .panel:last-child{ border-radius:0 14px 14px 0; }
  .panel .k{ font-size:12px; letter-spacing:3px; color:#a49d8e; font-weight:700; }
  .panel .v{ font-size:44px; font-weight:800; letter-spacing:-1px; margin-top:6px; }
  .panel .pts{ font-size:12.5px; color:#a49d8e; margin-top:3px; }
  .panel .row{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:10px; }
  .pill{ display:inline-block; background:var(--gold); color:#1a1814; font-size:12.5px;
         font-weight:800; border-radius:18px; padding:4px 12px; }
  .panel .ytd{ text-align:right; font-size:12px; color:#a49d8e; }
  .panel .ytd b{ display:block; font-size:16px; color:var(--gold); }
  .gse-kpis{ display:flex; gap:22px; margin:20px 48px 0; }
  .kpi{ flex:1; border-top:4px solid var(--ink); padding-top:10px; }
  .kpi .k{ font-size:12px; letter-spacing:2.5px; color:var(--muted); font-weight:700; text-transform:uppercase; }
  .kpi .v{ font-size:27px; font-weight:800; margin-top:3px; letter-spacing:-.5px; }
  .kpi .d{ font-size:12.5px; margin-top:2px; color:var(--muted); font-weight:600; }
  .gse-movers{ display:flex; gap:34px; margin:22px 48px 0; }
  .mv{ flex:1; }
  .mv h3{ font-size:13px; letter-spacing:3px; font-weight:800; padding-bottom:8px; }
  .mv.g h3{ color:var(--gold); border-bottom:3px solid var(--gold); }
  .mv.l h3{ color:var(--coral); border-bottom:3px solid var(--coral); }
  .mv .r{ display:flex; justify-content:space-between; padding:9px 2px; font-size:15.5px;
          border-bottom:1px solid var(--track); align-items:baseline; }
  .mv .r b{ font-weight:800; }
  .mv .r .p{ color:var(--muted); font-size:13.5px; margin-left:auto; margin-right:14px; }
  .mv .r .c{ font-weight:800; font-size:15px; }
  .gse-tr{ margin:24px 48px 0; }
  .gse-tr h3{ font-size:13px; letter-spacing:3px; color:var(--muted); font-weight:800; margin-bottom:12px; }
  .tr-row{ display:flex; align-items:center; gap:12px; margin-bottom:9px; }
  .tr-row .n{ width:64px; font-size:14px; font-weight:800; }
  .tr-row .track{ flex:1; height:15px; background:var(--track); border-radius:8px; overflow:hidden; }
  .tr-row .bar{ height:100%; border-radius:8px; background:var(--barsc); }
  .tr-row.top .bar{ background:var(--gold); } .tr-row.top .n{ color:var(--gold); }
  .tr-row .v{ width:78px; text-align:right; font-size:13px; font-weight:700; color:var(--muted); }
  .tr-row.top .v{ color:var(--ink); }
  .finexview{ margin:22px 48px 0; background:#1a1814; color:var(--ivory); border-radius:14px;
              padding:18px 24px; }
  .finexview h3{ font-size:12px; letter-spacing:3px; color:var(--gold); font-weight:800; margin-bottom:8px; }
  .finexview p{ font-size:14.5px; line-height:1.55; }
  .finexview b{ color:var(--gold); font-weight:700; }

  /* ---------- SPORTS ---------- */
  .sp-match{ margin:20px 48px 0; background:#1a1814; color:var(--ivory); border-radius:16px;
             padding:22px 28px; position:relative; overflow:hidden; }
  .sp-match .k{ font-size:12px; letter-spacing:3px; color:var(--gold); font-weight:800; }
  .sp-vs{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .sp-team{ text-align:center; width:200px; }
  .sp-team .crest{ width:64px; height:64px; margin:0 auto; border-radius:50%; display:flex;
                   align-items:center; justify-content:center; font-size:30px; }
  .sp-team h4{ font-size:19px; font-weight:800; margin-top:8px; }
  .sp-team .form{ display:flex; gap:5px; justify-content:center; margin-top:7px; }
  .sp-team .form i{ width:11px; height:11px; border-radius:50%; font-style:normal; }
  .f-w{ background:var(--emerald);} .f-d{ background:var(--gold);} .f-l{ background:var(--coral);}
  .sp-mid{ text-align:center; }
  .sp-mid .vs{ font-size:30px; font-weight:800; color:var(--gold); }
  .sp-mid .when{ font-size:12.5px; color:#a49d8e; margin-top:5px; line-height:1.5; }
  .sp-note{ margin-top:16px; border-top:1px solid #3a362e; padding-top:12px; font-size:13.5px;
            color:#cfcabd; line-height:1.5; }
  .sp-note b{ color:var(--gold); }
  .sp-sec{ margin:24px 48px 0; }
  .sp-sec h3{ font-size:13px; letter-spacing:3px; color:var(--muted); font-weight:800;
              border-bottom:3px solid var(--ink); padding-bottom:8px; margin-bottom:4px;
              display:flex; justify-content:space-between; align-items:center; }
  .lg-row{ display:flex; align-items:center; gap:12px; padding:8.5px 2px; border-bottom:1px solid var(--track);
           font-size:15px; }
  .lg-row .pos-n{ width:22px; color:var(--muted); font-weight:700; font-size:13.5px; }
  .lg-row b{ width:186px; font-weight:800; }
  .lg-row .track{ flex:1; height:11px; background:var(--track); border-radius:6px; overflow:hidden; }
  .lg-row .bar{ height:100%; background:var(--barsc); border-radius:6px; }
  .lg-row.top .bar{ background:var(--emerald); }
  .lg-row .pts-v{ width:58px; text-align:right; font-weight:800; font-size:14.5px; }
  .ab-row{ display:flex; align-items:center; gap:14px; padding:11px 2px; border-bottom:1px solid var(--track); }
  .ab-row .chip{ width:40px; height:40px; border-radius:10px; background:var(--track); display:flex;
                 align-items:center; justify-content:center; font-size:19px; flex:none; }
  .ab-row .who b{ font-size:15.5px; font-weight:800; display:block; }
  .ab-row .who span{ font-size:12.5px; color:var(--muted); }
  .ab-row .stat{ margin-left:auto; font-size:14px; font-weight:800; text-align:right; }
  .ab-row .stat span{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; }

  /* ---------- STREET PRICES ---------- */
  .stp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin:20px 48px 0; }

/* ================= FLIP ENGINE ================= */

const PAGE_W = 810, PAGE_H = 1080;
const book   = document.getElementById("book");
const scaler = document.getElementById("scaler");
const edgeL  = document.getElementById("edgeL");
const edgeR  = document.getElementById("edgeR");

/* build page nodes once */
const pageEls = PAGES.map(p=>{
  const el = document.createElement("div");
  el.className = "page" + (p.dark ? " dark" : "");
  el.innerHTML = p.html;
  return el;
});
const N = pageEls.length;              /* 10 pages */
const S = Math.ceil(N/2);              /* 5 sheets  */

let mode    = null;                    /* "spread" | "single" */
let current = 0;                       /* spread: sheets flipped (0..S) · single: page index (0..N-1) */
let animating = false;
let sheets  = [];

function clearBook(){
  book.querySelectorAll(".sheet, .page").forEach(n=>n.remove());
  /* wipe inline styles left over from the other mode */
  pageEls.forEach(p=>{ p.style.display=""; p.style.zIndex=""; p.style.transform="";
                       p.getAnimations?.().forEach(a=>a.cancel()); });
}

function buildSpread(){
  clearBook(); sheets = [];
  for(let s=0;s<S;s++){
    const sh = document.createElement("div"); sh.className = "sheet";
    const f  = document.createElement("div"); f.className = "face front";
    const b  = document.createElement("div"); b.className = "face back";
    f.appendChild(pageEls[2*s]);
    if(pageEls[2*s+1]) b.appendChild(pageEls[2*s+1]);
    sh.appendChild(f); sh.appendChild(b);
    book.appendChild(sh); sheets.push(sh);
  }
  renderSpread(false);
}
function renderSpread(animate=true){
  sheets.forEach((sh,i)=>{
    if(!animate) sh.style.transition = "none";
    sh.classList.toggle("flipped", i < current);
    sh.style.zIndex = (i < current) ? 10+i : 10+(S-i);
    if(!animate){ void sh.offsetWidth; sh.style.transition = ""; }
  });
  /* center the closed cover / closed back */
  const shift = current===0 ? -PAGE_W/2 : current===S ? PAGE_W/2 : 0;
  book.style.transform = `translateX(${shift}px)`;
  edgeL.style.width = Math.max(0, current-1) * 3 + "px";
  edgeR.style.width = Math.max(0, S-current-1) * 3 + "px";
  updateUI();
}
function flipSpread(dir){
  const t = current + dir;
  if(t<0 || t>S) return;
  const sh = sheets[dir>0 ? current : current-1];
  sh.classList.add("turning");
  setTimeout(()=>sh.classList.remove("turning"), 1800);
  current = t;
  renderSpread(true);
}

function buildSingle(){
  clearBook(); sheets = [];
  pageEls.forEach(p=>book.appendChild(p));
  renderSingle();
}
function renderSingle(){
  pageEls.forEach((p,i)=>{
    p.style.display = i===current ? "flex" : "none";
    p.style.zIndex  = i===current ? 20 : 10;
    p.style.transform = "";
  });
  edgeL.style.width = Math.min(current,8) * 2.5 + "px";
  edgeR.style.width = Math.min(N-1-current,8) * 2.5 + "px";
  book.style.transform = "";
  updateUI();
}
function flipSingle(dir, fast=false){
  const t = current + dir;
  if(t<0 || t>=N || animating) return;
  animating = true;
  const out  = pageEls[current], inn = pageEls[t];
  inn.style.display = "flex";
  const opts = { duration: fast ? 420 : 950, easing:"cubic-bezier(.42,.03,.18,1)", fill:"forwards" };
  let anim;
  if(dir>0){
    out.style.zIndex = 30; inn.style.zIndex = 20;
    anim = out.animate([{transform:"perspective(2200px) rotateY(0deg)", filter:"brightness(1)"},
                        {transform:"perspective(2200px) rotateY(-98deg)", filter:"brightness(.75)"}], opts);
  } else {
    inn.style.zIndex = 30; out.style.zIndex = 20;
    anim = inn.animate([{transform:"perspective(2200px) rotateY(-98deg)", filter:"brightness(.75)"},
                        {transform:"perspective(2200px) rotateY(0deg)", filter:"brightness(1)"}], opts);
  }
  const done = ()=>{
    if(!animating) return;
    animating = false;
    current = t;
    renderSingle();          /* hide the outgoing page first...   */
    anim.cancel();           /* ...then drop the persisted effect */
  };
  anim.onfinish = done;
  setTimeout(done, opts.duration + 120);   /* safety fallback */
}

/* mode & scaling */
function layout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const nextMode = vw < 820 ? "single" : "spread";
  if(nextMode !== mode){
    /* preserve position across modes */
    let pg = mode==="spread" ? Math.max(0, Math.min(N-1, current*2-1)) : current;
    if(mode===null) pg = 0;
    mode = nextMode;
    book.className = "mode-" + mode;
    if(mode==="spread"){ current = Math.ceil((pg+ (pg%2===0?0:1))/2); if(pg===0) current=0; buildSpread(); }
    else { current = pg; buildSingle(); }
  }
  const bw = mode==="spread" ? PAGE_W*2 : PAGE_W;
  const s  = Math.min((vw*0.94)/bw, (vh*0.90)/PAGE_H);
  scaler.style.transform = `scale(${s})`;
  scaler.style.width  = bw + "px";
  scaler.style.height = PAGE_H + "px";
  book.style.width  = bw + "px";
  book.style.height = PAGE_H + "px";
}

/* navigation facade */
function next(){ mode==="spread" ? flipSpread(1)  : flipSingle(1); }
function prev(){ mode==="spread" ? flipSpread(-1) : flipSingle(-1); }
function atStart(){ return current===0; }
function atEnd(){ return mode==="spread" ? current===S : current===N-1; }

/* jump to a page index (0-based) with a quick riffle in spread mode */
function goToPage(p){
  p = Math.max(0, Math.min(N-1, p));
  if(mode==="single"){
    if(p===current) return;
    const dir = p>current ? 1 : -1;
    const step = ()=>{ if(current!==p){ flipSingle(dir, true); setTimeout(step, 160); } };
    step();
  } else {
    const target = p===0 ? 0 : Math.ceil(p/2) + (p%2===0 ? 0 : 0);
    const tSheet = p%2===0 ? p/2 : (p+1)/2;
    const dir = tSheet>current ? 1 : -1;
    const step = ()=>{ if(current!==tSheet){ flipSpread(dir); setTimeout(step, 420); } };
    step();
  }
  closeToc();
}

/* ================= UI CHROME ================= */
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");
const pageInd = document.getElementById("pageInd");
const dotsEl  = document.getElementById("dots");
const tocOv   = document.getElementById("tocOv");

/* dots = one per spread position */
for(let i=0;i<=S;i++){
  const d = document.createElement("button");
  d.className = "dot"; d.setAttribute("aria-label","Go to position "+i);
  d.addEventListener("click", ()=>goToPage(i===0 ? 0 : i*2-1));
  dotsEl.appendChild(d);
}

function updateUI(){
  btnPrev.disabled = atStart();
  btnNext.disabled = atEnd();
  if(mode==="spread"){
    const l = current*2, r = current*2+1;
    pageInd.textContent = current===0 ? `Cover · 1 / ${N}` :
      current===S ? `Back cover · ${N} / ${N}` : `Pages ${l}–${r>N?N:r} / ${N}`;
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on", i===current));
  } else {
    pageInd.textContent = `Page ${current+1} / ${N}`;
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on", i===Math.ceil(current/2)+(current%2)));
  }
}

/* toc overlay */
const tocList = document.getElementById("tocList");
PAGES.forEach((p,i)=>{
  const b = document.createElement("button");
  b.className = "tp-row";
  b.innerHTML = `<span class="nn">${String(i+1).padStart(2,"0")}</span><span class="tt">${p.title}</span><span class="ss">${p.sub}</span>`;
  b.addEventListener("click", ()=>goToPage(i));
  tocList.appendChild(b);
});
function closeToc(){ tocOv.classList.remove("open"); }
document.getElementById("btnToc").addEventListener("click", ()=>tocOv.classList.add("open"));
tocOv.addEventListener("click", e=>{ if(e.target===tocOv) closeToc(); });

/* events */
btnNext.addEventListener("click", next);
btnPrev.addEventListener("click", prev);
document.getElementById("zoneR").addEventListener("click", next);
document.getElementById("zoneL").addEventListener("click", prev);
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight" || e.key===" ") next();
  if(e.key==="ArrowLeft") prev();
  if(e.key==="Escape") closeToc();
});
/* clickable cover TOC */
document.addEventListener("click", e=>{
  const row = e.target.closest("[data-goto]");
  if(row) goToPage(parseInt(row.dataset.goto,10));
});
/* corner peek on hover (spread) */
const zoneR = document.getElementById("zoneR"), zoneL = document.getElementById("zoneL");
zoneR.addEventListener("mouseenter", ()=>{ if(mode==="spread" && !atEnd()) sheets[current]?.classList.add("peek"); });
zoneR.addEventListener("mouseleave", ()=>sheets.forEach(s=>s.classList.remove("peek")));
zoneL.addEventListener("mouseenter", ()=>{ if(mode==="spread" && !atStart()) sheets[current-1]?.classList.add("peek"); });
zoneL.addEventListener("mouseleave", ()=>sheets.forEach(s=>s.classList.remove("peek")));

/* swipe */
let sx=null, sy=null;
document.addEventListener("pointerdown", e=>{ sx=e.clientX; sy=e.clientY; });
document.addEventListener("pointerup", e=>{
  if(sx===null) return;
  const dx = e.clientX-sx, dy = e.clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4){ dx<0 ? next() : prev(); }
  sx=sy=null;
});

/* auto-open the cover if the reader hasn't interacted shortly after load */
let interacted = false;
["pointerdown","keydown","wheel"].forEach(ev =>
  document.addEventListener(ev, ()=>{ interacted = true; }, { capture:true }));
setTimeout(()=>{ if(!interacted && current===0) next(); }, 1600);

window.addEventListener("resize", layout);
layout();
</script>
